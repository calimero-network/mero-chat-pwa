# Runs merobox workflow tests when logic or workflow files change.
# Builds curb.wasm, then validates all merobox workflow definitions against
# real merod nodes (e2e.yml = 3-node comprehensive, integration-setup.yml =
# 2-node setup for Playwright).

name: Workflow Tests

on:
  push:
    branches: [main, master]
    paths:
      - 'logic/**'
      - 'workflows/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'logic/**'
      - 'workflows/**'

concurrency:
  group: workflow-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  workflow-tests:
    name: merobox Workflow Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89.0"
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry + build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            logic/target
          key: cargo-${{ runner.os }}-${{ hashFiles('logic/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install cargo-mero
        uses: ./.github/actions/setup-cargo-mero

      # Builds res/curb.wasm (ABI embedded, wasm-opt'd) AND the .mpk, so the
      # nodes below run the same artifact a release publishes.
      #
      # ⚠️ `--output` is load-bearing. The default name embeds the package
      # version (dist/com.calimero.chat-3.1.1.mpk), so a release bump would
      # silently orphan every `path:` in workflows/ — and the scenarios would
      # fail at install, four minutes in, naming a file nothing wrote.
      - name: Build curb WASM and bundle
        working-directory: logic
        run: cargo mero bundle --dev --output dist/curb-dev.mpk

      - name: Install merobox
      # ⚠️ calimero-client-py MUST be pinned, not just merobox. It is the layer
      # that actually builds the admin-API request, merobox only requires a
      # floor, and it tracks core master — so an unpinned install silently picks
      # up whatever landed today.
      #
      # The two are a PAIR, and the rule is: take the client-py that was newest
      # when THAT merobox was built. 0.6.75 is the first merobox to declare
      # `calimero-client-py>=0.7.0`, so 0.7.0 is its partner. Getting this wrong
      # is not a version warning — 0.7.0 dropped the `metadata` kwarg the older
      # merobox passes, and the run dies at `install_application`.
      #
      # Both had to move for rc.38. 0.7.0 is the release that repinned onto
      # rc.31 and installs by coordinates — the same core#3652 change that took
      # raw wasm out of the protocol — and it carries the fix that stopped the
      # client dropping `admitters` from an invitation on re-encode, which an
      # rc.29+ node needs non-empty or it refuses the join.
        run: pip install merobox==0.6.75 calimero-client-py==0.7.0 && merobox --version

      - name: Run E2E workflow (3-node)
        working-directory: workflows
        run: |
          max_attempts=2
          attempt=1
          success=false
          while [ $attempt -le $max_attempts ]; do
            if [ $attempt -gt 1 ]; then
              merobox stop --all || true
              merobox nuke --force || true
              sleep 2
            fi
            # See integration-ci.yml for why --e2e-mode is required here.
            if merobox bootstrap run e2e.yml --e2e-mode; then
              success=true
              break
            fi
            attempt=$((attempt + 1))
          done
          merobox stop --all || true
          merobox nuke --force || true
          [ "$success" = true ] || exit 1

      - name: Run integration-setup workflow (2-node)
        working-directory: workflows
        run: |
          max_attempts=2
          attempt=1
          success=false
          while [ $attempt -le $max_attempts ]; do
            if [ $attempt -gt 1 ]; then
              merobox stop --all || true
              merobox nuke --force || true
              sleep 2
            fi
            if merobox bootstrap run integration-setup.yml --e2e-mode; then
              success=true
              break
            fi
            attempt=$((attempt + 1))
          done
          merobox stop --all || true
          merobox nuke --force || true
          [ "$success" = true ] || exit 1
